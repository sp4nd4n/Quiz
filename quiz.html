<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz</title>
<meta name="theme-color" content="#14101C">
<link rel="stylesheet" href="quiz-style.css">
</head>
<body>
<div class="motif" id="motif"></div>
<div class="wrap">

  <!-- LOADING -->
  <section class="view active" id="view-loading">
    <div class="spinner"></div>
  </section>

  <!-- ERROR -->
  <section class="view" id="view-error">
    <h2>This link doesn't lead anywhere</h2>
    <p>The quiz may have been removed, or the link's incomplete. Double-check it with whoever sent it.</p>
  </section>

  <!-- IDENTIFY -->
  <section class="view" id="view-identify">
    <p class="id-eyebrow">Before you start</p>
    <h2 class="id-title" id="id-title">Enter your details to start</h2>
    <div id="identify-fields"></div>
    <button class="btn-primary" id="btn-identify-continue" style="margin-top:8px">Start quiz</button>
  </section>

  <!-- QUESTION -->
  <section class="view" id="view-question">
    <div class="progress-row" id="progress-row"></div>
    <p class="q-count" id="q-count">Question 1 of 4</p>
    <h2 class="q-text" id="q-text">—</h2>
    <div class="opt-list" id="opt-list"></div>
    <div class="q-nav">
      <button class="btn-primary" id="btn-next" disabled>Next</button>
    </div>
  </section>

  <!-- SENDING -->
  <section class="view" id="view-sending">
    <div class="spinner"></div>
    <p>Locking in your answers…</p>
  </section>

  <!-- END -->
  <section class="view" id="view-end">
    <div class="end-badge">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h2 class="end-title" id="end-title">All done!</h2>
    <p class="end-sub" id="end-sub">Thanks for playing.</p>
  </section>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="quiz.js"></script>
</body>
</html>
